name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Syntax & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_mysql, openssl, json
          coverage: none

      - name: Syntax check (Lint)
        run: |
          find app public_html scripts tests -name "*.php" -exec php -l {} +

      - name: Run Test Suite
        run: |
          php tests/run_tests.php
